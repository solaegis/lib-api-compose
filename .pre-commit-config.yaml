repos:
  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.6.0
    hooks:
      - id: stylua
        args: [--config-path=.stylua.toml]
        files: \.lua$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        files: \.(yaml|yml)$
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      # Uses the luacheck on PATH (same as `task lint` and CI). The upstream hook builds
      # luacheck against the host's default Lua, which breaks on Lua 5.4+/5.5.
      - id: luacheck
        name: Luacheck
        entry: luacheck --config .luacheckrc
        language: system
        files: \.lua$

      - id: validate-manifest
        name: Validate LibApiCompose.txt manifest
        entry: bash -c 'lua scripts/validate-manifest.lua LibApiCompose.txt || luajit scripts/validate-manifest.lua LibApiCompose.txt'
        language: system
        files: ^LibApiCompose\.txt$
        pass_filenames: false

      - id: validate-esoui-static
        name: ESOUI static compliance (manifest, SVs, listing)
        entry: bash scripts/validate-esoui-compliance.sh --static
        language: system
        pass_filenames: false
        files: ^(LibApiCompose\.txt|README_ESOUI\.txt|src/Core\.lua)$

default_install_hook_types: [pre-commit]
