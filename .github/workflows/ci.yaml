name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # Keep in step with .pre-commit-config.yaml (StyLua) and the local toolchain.
  TASK_VERSION: v3.54.0

jobs:
  test:
    name: Lint and validate (${{ matrix.lua }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ESO runs Lua 5.1 semantics; LuaJIT matches the local dev toolchain.
        lua: ["5.1", "luajit-openresty"]
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ matrix.lua }}

      - uses: leafo/gh-actions-luarocks@v6

      - name: Install tools
        run: |
          luarocks install luacheck
          wget -qO- https://github.com/JohnnyMorganz/StyLua/releases/download/v2.6.0/stylua-linux-x86_64.zip | funzip -p > stylua
          chmod +x stylua
          sudo mv stylua /usr/local/bin/
          curl -sL https://taskfile.dev/install.sh | sudo sh -s -- -d -b /usr/local/bin "$TASK_VERSION"

      # Unit tests, lint, format check, manifest/ESOUI validation and the ZOS API drift check
      # (downloads ESOUIDocumentation.txt; a missing document fails the build in CI).
      - name: Run tests
        run: task test

      - name: Build and validate release ZIP
        run: |
          task build:fast
          bash scripts/validate-esoui-compliance.sh
