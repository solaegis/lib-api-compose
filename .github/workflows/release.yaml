name: Release LibApiCompose

on:
  push:
    tags:
      - "v*"

env:
  ADDON_NAME: LibApiCompose
  # Set to the ESOUI file id once the library is listed; "0" skips the upload.
  ESOUI_ADDON_ID: "0"
  # ESOUI "compatible" game version for the upload (resolved to an id by esoui-upload.sh).
  # Must match the manifest's live APIVersion: 12.1.0 = API 101051 (Update 51 / Season One).
  # Bump it whenever scripts/update-api-version.sh changes the manifest.
  ESO_API_VERSION: "12.1.0"
  TASK_VERSION: v3.54.0

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and changelog
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must be vMAJOR.MINOR.PATCH (got v$VERSION)"
            exit 1
          fi
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' entry"
            exit 1
          fi
          API_VERSION=$(grep "^## APIVersion:" "${ADDON_NAME}.txt" | awk '{print $3}')
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ZIP=dist/${ADDON_NAME}-${VERSION}.zip" >> "$GITHUB_OUTPUT"
          echo "UPDATE=Update $((API_VERSION - 101000))" >> "$GITHUB_OUTPUT"

      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v6

      - name: Install tools
        run: |
          luarocks install luacheck
          wget -qO- https://github.com/JohnnyMorganz/StyLua/releases/download/v2.6.0/stylua-linux-x86_64.zip | funzip -p > stylua
          chmod +x stylua
          sudo mv stylua /usr/local/bin/
          curl -sL https://taskfile.dev/install.sh | sudo sh -s -- -d -b /usr/local/bin "$TASK_VERSION"

      # Same entry point as local releases: tests, lint, validation, version stamping, ZIP checks.
      - name: Build release ZIP
        run: task build

      - name: ESOUI compliance
        run: bash scripts/validate-esoui-compliance.sh

      - name: Extract changelog
        run: |
          awk -v ver="${{ steps.version.outputs.VERSION }}" '
            index($0, "## [" ver "]") == 1 { found=1; print; next }
            /^## \[/ { if (found) exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          test -s release_notes.md

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          name: "${{ env.ADDON_NAME }} v${{ steps.version.outputs.VERSION }} (${{ steps.version.outputs.UPDATE }})"
          tag: "v${{ steps.version.outputs.VERSION }}"
          artifacts: "${{ steps.version.outputs.ZIP }}"
          artifactContentType: application/zip
          bodyFile: release_notes.md
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to ESOUI
        if: ${{ env.ESOUI_ADDON_ID != '0' }}
        env:
          ESOUI_API_KEY: ${{ secrets.ESOUI_API_KEY }}
        run: |
          bash scripts/esoui-upload.sh \
            "${{ env.ESOUI_ADDON_ID }}" \
            "${{ steps.version.outputs.VERSION }}" \
            "${{ steps.version.outputs.ZIP }}" \
            "${{ env.ESO_API_VERSION }}" \
            "CHANGELOG.md" \
            "README_ESOUI.txt"
